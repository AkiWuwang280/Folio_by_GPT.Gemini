<div id="paper-theme-settings" class="paper-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>纸访主题 · Paper Theme</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <p class="paper-settings-intro">让界面回到安静、清晰、适合长时间阅读的状态。</p>

            <section class="paper-settings-group">
                <h4>配色主题</h4>
                <label class="paper-field">
                    <span>刊物配色</span>
                    <select data-setting="palette">
                        <option value="deep-purple">深紫夜刊</option>
                        <option value="deep-gray">深灰夜刊</option>
                        <option value="light-lilac">浅紫刊物</option>
                        <option value="warm-paper">暖白纸刊</option>
                    </select>
                </label>
                <p class="paper-hint">配色与背景相互独立，切换配色不会清除背景设置。</p>
            </section>

            <section class="paper-settings-group">
                <h4>阅读排版</h4>
                <label class="paper-field">
                    <span>字号 <output data-output="fontSize">16</output> px</span>
                    <input type="range" min="12" max="24" step="1" data-setting="fontSize">
                </label>
                <label class="paper-field">
                    <span>行距 <output data-output="lineHeight">1.68</output></span>
                    <input type="range" min="1.2" max="2.2" step="0.02" data-setting="lineHeight">
                </label>
                <label class="paper-field">
                    <span>阅读宽度 <output data-output="contentWidth">900</output> px</span>
                    <input type="range" min="480" max="1400" step="20" data-setting="contentWidth">
                </label>
                <label class="paper-field">
                    <span>AI 字体</span>
                    <input type="text" maxlength="80" placeholder="留空则使用酒馆默认字体" data-setting="aiFont">
                </label>
                <label class="paper-field">
                    <span>玩家字体</span>
                    <input type="text" maxlength="80" placeholder="留空则使用酒馆默认字体" data-setting="userFont">
                </label>
            </section>

            <section class="paper-settings-group">
                <h4>背景与纹理</h4>
                <label class="paper-field">
                    <span>背景图片 URL</span>
                    <input type="url" placeholder="https://example.com/background.jpg" data-setting="backgroundUrl">
                </label>
                <label class="paper-field">
                    <span>背景透明度 <output data-output="backgroundOpacity">0.22</output></span>
                    <input type="range" min="0" max="1" step="0.02" data-setting="backgroundOpacity">
                </label>
                <label class="paper-field">
                    <span>背景模糊 <output data-output="backgroundBlur">0</output> px</span>
                    <input type="range" min="0" max="20" step="1" data-setting="backgroundBlur">
                </label>
                <label class="paper-field">
                    <span>纸张纹理 <output data-output="texture">0.025</output></span>
                    <input type="range" min="0" max="0.12" step="0.005" data-setting="texture">
                </label>
                <p class="paper-hint">背景支持 http / https 图片链接。留空即可关闭背景图。</p>
            </section>

            <section class="paper-settings-group">
                <h4>界面细节</h4>
                <label class="paper-check">
                    <input type="checkbox" data-setting="borders">
                    <span>显示细分隔线与消息边框</span>
                </label>
            </section>

            <div class="paper-settings-footer">
                <button type="button" class="menu_button" data-action="reset">恢复纸访主题默认值</button>
                <small>设置会自动保存。恢复默认值不会影响酒馆的其他设置。</small>
            </div>
        </div>
    </div>
</div>
