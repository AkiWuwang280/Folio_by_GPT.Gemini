<div id="folio-settings" class="folio-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header"><b>页序 · Folio</b><div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div></div>
    <div class="inline-drawer-content">
      <div class="folio-intro"><span class="folio-kicker">A QUIET READING INTERFACE</span><p>把聊天排成一页舒展、清晰的文字。</p><span class="folio-version">1.3.8</span></div>
      <div class="inline-drawer folio-subdrawer">
        <div class="inline-drawer-toggle inline-drawer-header"><b>主题配色</b><div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div></div>
        <div class="inline-drawer-content"><label>配色方案</label><select data-folio-setting="palette"><option value="ink-night">墨夜 · 石墨与纸白</option><option value="warm-paper">暖纸 · 奶油与古金</option><option value="mist-water">雾青 · 清水与薄荷</option><option value="sakura">樱笺 · 樱粉与暖白</option><option value="violet-archive">紫宸 · 暮紫与银灰</option></select><p class="folio-hint">配色控制界面、正文纸面与文字层级；背景图片仍可独立设置。</p></div>
      </div>
      <div class="inline-drawer folio-subdrawer">
        <div class="inline-drawer-toggle inline-drawer-header"><b>背景</b><div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div></div>
       <div class="inline-drawer-content">
          <label>背景图片地址</label><input type="url" data-folio-setting="backgroundUrl" placeholder="https://...">
          <div class="folio-range-label"><label>背景遮罩</label><output data-folio-output="backgroundOpacity">0.22</output></div><input type="range" min="0" max=".85" step=".01" data-folio-setting="backgroundOpacity">
          <label class="folio-check"><input type="checkbox" data-folio-setting="watermark"><span>MEMENTO 几何暗纹</span></label>
          <div class="folio-range-label"><label>暗纹透明度</label><output data-folio-output="watermarkOpacity">60%</output></div><input type="range" min="0" max="1" step=".01" data-folio-setting="watermarkOpacity">
          <p class="folio-hint">支持公开访问的图片 URL；留空时保留主题原有背景。</p>
        </div>
      </div>
      <div class="inline-drawer folio-subdrawer">
        <div class="inline-drawer-toggle inline-drawer-header"><b>字体与排版</b><div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div></div>
        <div class="inline-drawer-content">
          <label>角色正文字体</label><select data-folio-setting="charFont"><option value="noto-serif">思源宋体 · Noto Serif SC</option><option value="noto-sans">思源黑体 · Noto Sans SC</option><option value="kaiti">楷体 · 设备支持时使用</option><option value="system-serif">系统衬线字体</option><option value="system-sans">系统无衬线字体</option></select>
          <label>玩家正文字体</label><select data-folio-setting="userFont"><option value="noto-sans">思源黑体 · Noto Sans SC</option><option value="noto-serif">思源宋体 · Noto Serif SC</option><option value="kaiti">楷体 · 设备支持时使用</option><option value="system-serif">系统衬线字体</option><option value="system-sans">系统无衬线字体</option></select>
          <div class="folio-range-label"><label>正文字号比例</label><output data-folio-output="fontScale">1.06</output></div><input type="range" min=".8" max="1.4" step=".01" data-folio-setting="fontScale">
          <div class="folio-range-label"><label>行高</label><output data-folio-output="lineHeight">1.95</output></div><input type="range" min="1.4" max="2.4" step=".05" data-folio-setting="lineHeight">
          <div class="folio-range-label"><label>每行字数上限</label><output data-folio-output="measure">40</output></div><input type="range" min="28" max="60" step="1" data-folio-setting="measure">
          <div class="folio-range-label"><label>段落间距</label><output data-folio-output="paragraphGap">0.75</output></div><input type="range" min="0" max="1.6" step=".05" data-folio-setting="paragraphGap">
          <p class="folio-hint">字体使用内置字体栈，不需要手动猜字体名称；设备缺少楷体时会自动回退。</p>
        </div>
      </div>
      <div class="inline-drawer folio-subdrawer">
        <div class="inline-drawer-toggle inline-drawer-header"><b>消息版式</b><div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div></div>
        <div class="inline-drawer-content">
          <label class="folio-check"><input type="checkbox" data-folio-setting="pageNumbers"> 显示消息页码</label>
          <label class="folio-check"><input type="checkbox" data-folio-setting="openingPage"> 首条消息采用扉页留白</label>
          <label class="folio-check"><input type="checkbox" data-folio-setting="rules"> 显示消息分隔线</label>
          <p class="folio-hint">头像尺寸、消息留白、头像与正文间距沿用原作者的桌面与手机参数。</p>
        </div>
      </div>
      <div class="folio-footer"><button id="folio-reset" type="button" class="menu_button">恢复默认设置</button><span>调整后自动保存</span></div>
    </div>
  </div>
</div>
